name: Political Events Study

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full event study too (yes/no)"
        default: "yes"
        required: true

permissions:
  contents: write

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python biggest_moves.py
      - run: python events.py
        if: ${{ inputs.full != 'no' }}
        env:
          SKIP_TEST2: ${{ inputs.full == 'markets' && '1' || '0' }}
      - name: Save results
        if: always()
        run: |
          git config user.name "nyse-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events || true
          git diff --quiet --cached || git commit -m "Political events study results"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 10; done
