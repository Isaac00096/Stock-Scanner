name: Daily NYSE Scan

on:
  schedule:
    - cron: "0 22 * * 1-5"   # weekdays 22:00 UTC (00:00 SAST), after the US close
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scanner.py
      - name: Commit dashboard
        run: |
          git config user.name "nyse-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase
          git add docs/index.html
          git diff --quiet --cached || git commit -m "Daily scan: $(date -u +'%Y-%m-%d')"
          git push
