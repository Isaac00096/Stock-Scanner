name: Multi-timeframe Opening Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day of 1-minute data (includes ~4 weeks warm-up)"
        default: "2026-07-01"
        required: true
      out:
        description: "Output file name stem"
        default: "mtf_rows"
        required: true

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt requests
      - name: Download and build rows
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          MTF_OUT: ${{ inputs.out }}_${{ matrix.shard }}.csv.gz
          SHARD: ${{ matrix.shard }}
          SHARDS: 2
        run: python backtest_mtf.py --start "${{ inputs.start }}"
      - name: Save rows
        if: always()
        run: |
          git config user.name "nyse-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/opening/*.csv.gz || true
          git diff --quiet --cached || git commit -m "Multi-timeframe backtest rows (part ${{ matrix.shard }})"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep $((RANDOM % 20 + 5)); done
