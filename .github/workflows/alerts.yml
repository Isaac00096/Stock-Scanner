name: Entry Alerts

on:
  schedule:
    - cron: "15 10 * * *"     # 12:15 SA time daily, before the 14:41 phone check
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python alerts.py
      - name: Save
        run: |
          git config user.name "nyse-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/alerts
          git diff --quiet --cached || git commit -m "Entry alerts"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 10; done
